services:
  - type: web
    name: space-weather-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn space_weather_dashboard.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "codeonauts-vjyi.onrender.com,codeonauts.hussainkadiwal.tech"
      - key: NASA_API_KEY
        value: "4Jp6SnPhOCWiYhUSNGteTYn0XHpMNkhvEu3cn2sd"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://codeonauts-vjyi.onrender.com,https://codeonauts.hussainkadiwal.tech"
